# Wazuh vulnerability enrichment configuration.
# Values like ${VAR_NAME} are expanded from environment variables at runtime.

WAZUH_INDEXER_URL: ${WAZUH_INDEXER_URL}
WAZUH_INDEXER_USERNAME: ${WAZUH_INDEXER_USERNAME}
WAZUH_INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
WAZUH_CA_CERT: ${WAZUH_CA_CERT}
VERIFY_SSL: true

WAZUH_VULN_INDEX_PATTERN: wazuh-states-vulnerabilities-*
ENRICHED_INDEX_PREFIX: wazuh-vuln-enriched
CVE_SUMMARY_INDEX_PREFIX: wazuh-vuln-cve-summary
HOST_SUMMARY_INDEX_PREFIX: wazuh-vuln-host-summary

CACHE_DIR: /var/lib/wazuh-enrich/cache
STATE_FILE: /var/lib/wazuh-enrich/state.json
PAGE_SIZE: 2000
BULK_SIZE: 1000
REQUEST_TIMEOUT_SECONDS: 30
SCROLL_TTL: 5m

CISA_KEV_URL: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
# Optional offline/mirror mode. If set, the service reads KEV from this local
# JSON file instead of downloading from CISA.
CISA_KEV_FILE: ${CISA_KEV_FILE}
EPSS_URL: https://epss.empiricalsecurity.com/epss_scores-current.csv.gz
# Optional local PoC feed. Supports CSV or JSON and is loaded offline/batch.
POC_FEED_FILE: ${POC_FEED_FILE}

# Optional automatic PoC feed builder. It reads trusted metadata sources and
# writes POC_FEED_FILE/output_file. Prefer local mirrors/checkouts in production.
POC_BUILD:
  enabled: false
  interval_seconds: 86400
  output_file: /var/lib/wazuh-enrich/feeds/cve_poc.csv
  # Can be an HTTPS metadata URL or a local file path.
  # For offline production, replace this with a local mirror path, for example:
  # /data/security-feeds/exploitdb/files_exploits.csv
  exploitdb_csv: https://gitlab.com/exploit-database/exploitdb/-/raw/main/files_exploits.csv
  # Optional extra sources. Uncomment when you want wider coverage.
  # These can be GitHub repository URLs, ZIP archive URLs, or local directories.
  # nuclei_templates: https://github.com/projectdiscovery/nuclei-templates
  # poc_in_github: https://github.com/nomi-sec/PoC-in-GitHub
  # trickest_cve: https://github.com/trickest/cve

TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}

ALERT_THRESHOLDS:
  epss_high: 0.7
  epss_medium: 0.3
  cve_many_agents: 25
  max_top_cves: 10

SCHEDULE:
  kev_sync_seconds: 3600
  epss_sync_seconds: 86400
  enrichment_seconds: 900
  full_refresh_seconds: 86400
  detect_new_agents_seconds: 300
