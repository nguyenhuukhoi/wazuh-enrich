# Wazuh vulnerability enrichment configuration.
# Values like ${VAR_NAME} are expanded from environment variables at runtime.

WAZUH_INDEXER_URL: ${WAZUH_INDEXER_URL}
WAZUH_INDEXER_USERNAME: ${WAZUH_INDEXER_USERNAME}
WAZUH_INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD}
WAZUH_CA_CERT: ${WAZUH_CA_CERT}
VERIFY_SSL: true

WAZUH_VULN_INDEX_PATTERN: wazuh-states-vulnerabilities-*
# Optional SCA workaround verification. Keep disabled until you create a small
# dedicated workaround SCA policy. Do not scan all generic SCA results.
SCA_WORKAROUND_ENABLED: false
WAZUH_SCA_INDEX_PATTERN: wazuh-states-sca-*
SCA_WORKAROUND_QUERY: workaround CVE
AGENT_INVENTORY_INDEX_PATTERNS:
  - wazuh-states-inventory-system-*
  - wazuh-states-inventory-packages-*
  - wazuh-states-inventory-hotfixes-*
  - wazuh-states-inventory-interfaces-*
  - wazuh-states-inventory-networks-*
INVENTORY_WATCH_TIMESTAMP_FIELDS:
  - "@timestamp"
  - event.created
  - timestamp
ENRICHED_INDEX_PREFIX: wazuh-vuln-enriched
CVE_SUMMARY_INDEX_PREFIX: wazuh-vuln-cve-summary
HOST_SUMMARY_INDEX_PREFIX: wazuh-vuln-host-summary
HOST_CVE_IMPACT_INDEX_PREFIX: wazuh-vuln-host-cve-impact

CACHE_DIR: /var/lib/wazuh-enrich/cache
STATE_FILE: /var/lib/wazuh-enrich/state.json
PAGE_SIZE: 2000
BULK_SIZE: 1000
REQUEST_TIMEOUT_SECONDS: 30
SCROLL_TTL: 5m

CISA_KEV_URL: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
# Optional offline/mirror mode. If set, the service reads KEV from this local
# JSON file instead of downloading from CISA.
CISA_KEV_FILE: ${CISA_KEV_FILE}
EPSS_URL: https://epss.empiricalsecurity.com/epss_scores-current.csv.gz
# Optional local PoC feed. Supports CSV or JSON and is loaded offline/batch.
POC_FEED_FILE: ${POC_FEED_FILE}
# Optional curated workaround metadata and Ansible verification result files.
# Ansible should apply/verify workarounds and write WORKAROUND_RESULT_FILE.
WORKAROUND_FEED_FILE: /var/lib/wazuh-enrich/feeds/cve_workarounds.yaml
WORKAROUND_RESULT_FILE: /var/lib/wazuh-enrich/feeds/workaround_results.json
# If the same agent_id + CVE has both Ansible and SCA verification:
# sca_first keeps the old behavior: SCA overrides Ansible.
# ansible_first lets Ansible override SCA.
WORKAROUND_VERIFICATION_PRIORITY: sca_first

# Optional workaround collector. It searches vendor pages for workaround
# candidates and writes WORKAROUND_FEED_FILE. Keep review_status=needs_review
# until you review the vendor guidance and create/approve an Ansible playbook.
WORKAROUND_COLLECTOR:
  enabled: false
  interval_seconds: 86400
  output_file: /var/lib/wazuh-enrich/feeds/cve_workarounds.yaml
  sources:
    - ubuntu
  include_patch_decisions:
    - patch_now
    - needs_review
    - patch_scheduled
  max_cves_per_run: 100
  timeout_seconds: 30
  fetch_linked_pages: true

# Optional automatic PoC feed builder. It reads trusted metadata sources and
# writes POC_FEED_FILE/output_file. Prefer local mirrors/checkouts in production.
POC_BUILD:
  enabled: false
  interval_seconds: 86400
  output_file: /var/lib/wazuh-enrich/feeds/cve_poc.csv
  # Can be an HTTPS metadata URL or a local file path.
  # For offline production, replace this with a local mirror path, for example:
  # /data/security-feeds/exploitdb/files_exploits.csv
  exploitdb_csv: https://gitlab.com/exploit-database/exploitdb/-/raw/main/files_exploits.csv
  # Optional extra sources. Uncomment when you want wider coverage.
  # These can be GitHub repository URLs, ZIP archive URLs, or local directories.
  # nuclei_templates: https://github.com/projectdiscovery/nuclei-templates
  # poc_in_github: https://github.com/nomi-sec/PoC-in-GitHub
  # trickest_cve: https://github.com/trickest/cve

# Ubuntu official verification feed. This is used to verify whether an active
# Wazuh finding is confirmed by Canonical metadata and whether a fixed package
# version exists. URLs can be HTTPS or local mirrored files.
UBUNTU_OVAL:
  enabled: true
  max_age_hours: 24
  base_url: https://security-metadata.canonical.com/oval
  osv_enabled: true
  osv_url: https://security-metadata.canonical.com/osv/osv-all.tar.xz
  osv_max_age_hours: 24
  releases:
    - noble   # Ubuntu 24.04
    - jammy   # Ubuntu 22.04
    - focal   # Ubuntu 20.04
  urls:
    noble: https://security-metadata.canonical.com/oval/com.ubuntu.noble.usn.oval.xml.bz2
    jammy: https://security-metadata.canonical.com/oval/com.ubuntu.jammy.usn.oval.xml.bz2
    focal: https://security-metadata.canonical.com/oval/com.ubuntu.focal.usn.oval.xml.bz2

TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}

ALERT_THRESHOLDS:
  epss_high: 0.7
  epss_medium: 0.3
  cve_many_agents: 25
  # Which CVE group Telegram should alert on:
  # critical_real_impact = vendor confirms impact and exploit signal exists (default)
  # needs_review = high-threat CVEs where vendor/package confirmation is incomplete
  # patch_scheduled = vendor confirms affected but patch can be planned
  # all = include all alert-eligible CVEs
  alert_scope: critical_real_impact
  # true = every active CVE that affects at least one current agent is alert-eligible.
  send_all_impacted_cves: false
  # false = dedup alert by state file. true = send every eligible alert every cycle.
  send_all_alerts: false
  # true = only alert CVEs that currently impact the system and have public PoC metadata.
  public_poc_only: false
  # How often Telegram may resend the same aggregate cycle alert.
  # 0 = no time limit.
  # If send_all_alerts is true, Telegram can send again every enrichment cycle.
  # If send_all_alerts is false, STATE_FILE dedup still prevents old CVE alerts from repeating.
  alert_interval_seconds: 0
  # Set 0 to include every matched CVE in the Telegram message.
  max_top_cves: 10

SCHEDULE:
  kev_sync_seconds: 3600
  epss_sync_seconds: 86400
  ubuntu_osv_sync_seconds: 86400
  inventory_watch_seconds: 60
  inventory_stabilization_seconds: 180
  max_inventory_agents_per_cycle: 100
  enrichment_seconds: 900
  full_refresh_seconds: 86400
  detect_new_agents_seconds: 300
